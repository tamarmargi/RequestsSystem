name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + unit and integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/RequestsSystem.sln

      - name: Build
        run: dotnet build backend/RequestsSystem.sln --configuration Release --no-restore

      # Integration tests start SQL Server with Testcontainers; Docker is available on ubuntu-latest.
      - name: Test
        run: dotnet test backend/RequestsSystem.sln --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/

  frontend:
    name: Frontend (tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Vitest with jsdom (Angular unit-test builder): a single headless run, no browser needed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
