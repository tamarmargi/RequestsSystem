<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שינוי סטטוס</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#007A3D}a:hover{color:#005F2F}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.s-prog{background:#FEF1DF;color:#9A5200}.s-prog .dot{background:#F29219}
.s-wait{background:#F0EAFB;color:#6A3DB5}.s-wait .dot{background:#6A3DB5}
.s-done{background:#E9EEEB;color:#3D4943}.s-done .dot{background:#5B6660}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid #DDE3DF;border-radius:10px;cursor:pointer;min-height:44px;box-sizing:border-box}
</style>
</helmet>
<div dir="rtl" style="width: 560px; height: 560px; box-sizing: border-box; background: rgba(27, 36, 32, 0.45); display: flex; align-items: center; justify-content: center; font-family: 'Heebo', system-ui, sans-serif; color: #1B2420">
<div role="dialog" aria-labelledby="sd-title" style="width: 480px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 12px 32px rgba(27, 36, 32, 0.18); display: flex; flex-direction: column">
<div style="padding: 20px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div>
<h2 id="sd-title" style="margin: 0; font-size: 18px; font-weight: 700">שינוי סטטוס</h2>
<p style="margin: 4px 0 0; font-size: 14px; color: #5B6660">פנייה 48207 · תלונה על עיכוב בתשלום</p>
</div>
<button type="button" aria-label="סגירה" style="width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; color: #3D4943; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
<span style="color: #5B6660">סטטוס נוכחי:</span>
<span class="badge s-prog"><span class="dot"></span>בטיפול</span>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 14px; font-weight: 600; margin-bottom: 10px; padding: 0">להעביר ל:</legend>
<label class="opt" style="border-color: #007A3D; background: #EEF7F1"><input type="radio" name="st" checked><span class="badge s-done"><span class="dot"></span>הושלמה</span><span style="font-size: 13px; color: #5B6660">הפנייה טופלה ונסגרה</span></label>
<label class="opt"><input type="radio" name="st"><span class="badge s-wait"><span class="dot"></span>ממתינה</span><span style="font-size: 13px; color: #5B6660">ממתינה למידע או לגורם חיצוני</span></label>
</fieldset>
<p style="margin: 0; font-size: 13px; color: #5B6660; display: flex; gap: 8px; align-items: flex-start">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
מוצגים רק המעברים המותרים מהסטטוס הנוכחי. פנייה שהושלמה היא סופית.
</p>
</div>
<div style="padding: 16px 24px; border-top: 1px solid #EDF0EE; display: flex; justify-content: flex-start; gap: 10px">
<button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: #007A3D; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">עדכון סטטוס</button>
<button type="button" style="height: 40px; padding: 0 18px; border: 1px solid #CDD5D0; border-radius: 8px; background: #FFFFFF; color: #1B2420; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">ביטול</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
