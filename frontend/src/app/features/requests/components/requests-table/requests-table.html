<div class="scroll">
  <table
    mat-table
    class="table"
    [dataSource]="items()"
    [trackBy]="trackById"
    matSort
    matSortDisableClear
    [matSortActive]="sortBy()"
    [matSortDirection]="sortDirection()"
    (matSortChange)="onSort($event)"
  >
    <caption class="visually-hidden">רשימת פניות</caption>

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef class="cell cell--select">
        <mat-checkbox
          aria-label="בחירת כל הפניות בעמוד"
          [checked]="allSelected()"
          [indeterminate]="someSelected()"
          (change)="togglePage.emit($event.checked)"
        />
      </th>
      <td mat-cell *matCellDef="let row" class="cell cell--select">
        <mat-checkbox
          [aria-label]="'בחירת פנייה ' + row.id"
          [checked]="selectedIds().has(row.id)"
          (change)="toggleRow.emit(row.id)"
        />
      </td>
    </ng-container>

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef class="cell">מס׳</th>
      <td mat-cell *matCellDef="let row" class="cell muted">{{ row.id }}</td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="title" class="cell">כותרת</th>
      <td mat-cell *matCellDef="let row" class="cell cell--title">{{ row.title }}</td>
    </ng-container>

    <ng-container matColumnDef="organizationName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="organizationName" class="cell">ארגון</th>
      <td mat-cell *matCellDef="let row" class="cell">{{ row.organizationName }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="cell">סטטוס</th>
      <td mat-cell *matCellDef="let row" class="cell"><app-status-badge [status]="row.status" /></td>
    </ng-container>

    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="priority" class="cell">עדיפות</th>
      <td mat-cell *matCellDef="let row" class="cell"><app-priority-label [priority]="row.priority" /></td>
    </ng-container>

    <ng-container matColumnDef="assignedTo">
      <th mat-header-cell *matHeaderCellDef class="cell">מטפל</th>
      <td mat-cell *matCellDef="let row" class="cell" [class.muted]="!row.assignedTo">
        {{ row.assignedTo ?? 'לא שובץ' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="createdAt" class="cell">נוצרה</th>
      <td mat-cell *matCellDef="let row" class="cell">{{ row.createdAt | date: dateFormat }}</td>
    </ng-container>

    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="updatedAt" class="cell">עודכנה</th>
      <td mat-cell *matCellDef="let row" class="cell muted">{{ row.updatedAt | date: dateFormat }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="cell cell--actions"><span class="visually-hidden">פעולות</span></th>
      <td mat-cell *matCellDef="let row" class="cell cell--actions">
        <div class="actions">
          <button
            type="button"
            class="icon-btn"
            [attr.aria-label]="'שינוי סטטוס לפנייה ' + row.id"
            title="שינוי סטטוס"
            (click)="changeStatus.emit(row)"
          >
            <app-icon name="edit" />
          </button>
          <button
            type="button"
            class="icon-btn"
            [attr.aria-label]="'היסטוריית שינויים של פנייה ' + row.id"
            title="היסטוריית שינויים"
            (click)="showHistory.emit(row)"
          >
            <app-icon name="history" />
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" class="row" [class.row--selected]="selectedIds().has(row.id)"></tr>
  </table>
</div>
