# Serves the built Angular app and proxies /api to the API container, so the browser talks to one origin
# (no CORS), exactly like the dev server's proxy.conf.json in local development.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html is never cached, so a new build is picked up immediately; hashed bundles can be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes are served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
